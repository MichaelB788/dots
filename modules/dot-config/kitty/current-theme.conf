# vim:ft=kitty

## name: Nvim Default Dark
## blurb: Based on the Neovim 0.10+ default colorscheme (NvimDark/NvimLight palette)


#: The basic colors

foreground #c4c6cd
background #14161b
selection_foreground #eef1f8
selection_background #4f5258


#: Cursor colors

cursor #c4c6cd
cursor_text_color #14161b


#: URL underline color when hovering with mouse

url_color #8cf8f7


#: kitty window border colors and terminal bell colors

active_border_color #9b9ea4
inactive_border_color #2c2e33
bell_border_color #fce094
visual_bell_color none


#: OS Window titlebar colors

wayland_titlebar_color #07080d
macos_titlebar_color #07080d


#: Tab bar colors

active_tab_foreground #eef1f8
active_tab_background #4f5258
inactive_tab_foreground #9b9ea4
inactive_tab_background #2c2e33
tab_bar_background #07080d
tab_bar_margin_color none


#: Colors for marks (marked text in the terminal)

mark1_foreground #14161b
mark1_background #a6dbff
mark2_foreground #14161b
mark2_background #fce094
mark3_foreground #14161b
mark3_background #b3f6c0


#: The basic 16 colors

#: black
color0 #07080d
color8 #4f5258

#: red
color1 #ffc0b9
color9 #ffc0b9

#: green
color2 #b3f6c0
color10 #b3f6c0

#: yellow
color3 #fce094
color11 #fce094

#: blue
color4 #a6dbff
color12 #a6dbff

#: magenta
color5 #ffcaff
color13 #ffcaff

#: cyan
color6 #8cf8f7
color14 #8cf8f7

#: white
color7 #c4c6cd
color15 #eef1f8
