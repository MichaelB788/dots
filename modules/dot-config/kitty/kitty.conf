# See https://sw.kovidgoyal.net/kitty/conf/ for configuration options

enable_audio_bell no

font_size 14

map ctrl+shift+e next_layout

map ctrl+shift+n next_tab
map ctrl+shift+p previous_tab

map ctrl+shift+l next_window
map ctrl+shift+h previous_window

map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+t     new_tab_with_cwd

# BEGIN_KITTY_THEME
# Kanagawa_dragon
include current-theme.conf
# END_KITTY_THEME

# BEGIN_KITTY_FONTS
font_family      family="JetBrains Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
